spring:
  application:
    name: mini-crm-backend

  profiles:
    active: dev

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  rate-limit:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:minicrm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-please-override-in-production-env}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/minicrm
    username: ${DB_USERNAME:minicrm}
    password: ${DB_PASSWORD:minicrm}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:minicrm-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  rate-limit:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:test-secret-key-not-for-production-use-minimum-32-bytes}

---
spring:
  config:
    activate:
      on-profile: integration-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  rate-limit:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:test-secret-key-not-for-production-use-minimum-32-bytes}
